<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - Sistema de Divulgação</title>
    <link rel="stylesheet" href="/frontend/css/style.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body>
    <div class="auth-container">
        <form class="auth-form" id="registerForm">
            <h2><i class="fas fa-user-plus"></i> Cadastrar</h2>
            
            <div class="form-group">
                <label for="name">Nome Completo</label>
                <input type="text" id="name" required placeholder="Seu nome">
            </div>
            
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" required placeholder="seu@email.com">
            </div>
            
            <div class="form-group">
                <label for="password">Senha</label>
                <input type="password" id="password" required placeholder="Mínimo 6 caracteres">
            </div>
            
            <div class="form-group">
                <label for="confirmPassword">Confirmar Senha</label>
                <input type="password" id="confirmPassword" required placeholder="Repita a senha">
            </div>
            
            <button type="submit" class="btn-submit">
                <i class="fas fa-user-plus"></i> Cadastrar
            </button>
            
            <div class="form-footer">
                <p>Já tem uma conta? <a href="login.html">Entre aqui</a></p>
            </div>
        </form>
    </div>

    <script src="js/auth.js"></script>
</body>
</html>
