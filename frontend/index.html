            }
        ];

        const menu = document.getElementById('menu');

        dados.forEach(secao => {
            const li = document.createElement('li');
            li.className = 'dropdown';

            li.innerHTML = `
    <a href="#">${secao.titulo}</a>
    <ul class="submenu">
      ${secao.itens.map(item => `<li><a href="#">${item}</a></li>`).join('')}
    </ul>
  `;
            menu.appendChild(li);
        });

        // Comportamento dos dropdowns
        menu.addEventListener('click', e => {
            const link = e.target.closest('a');
            if (!link) return;

            const dropdown = link.parentElement;
            const sub = dropdown.querySelector('.submenu');
            if (!sub) return;

            e.preventDefault();

            // Toggle do submenu
            const estaAberto = sub.classList.contains('ativo');

            // Fecha todos os submenus
            document.querySelectorAll('.submenu.ativo').forEach(s => s.classList.remove('ativo'));
            document.querySelectorAll('.dropdown > a.ativo').forEach(a => a.classList.remove('ativo'));

            // Abre o clicado se estava fechado
            if (!estaAberto) {
                sub.classList.add('ativo');
                link.classList.add('ativo');
            }
        });

        // Fecha ao clicar fora
        addEventListener('click', e => {
            if (!e.target.closest('.menu-vertical')) {
                document.querySelectorAll('.submenu.ativo').forEach(s => s.classList.remove('ativo'));
                document.querySelectorAll('.dropdown > a.ativo').forEach(a => a.classList.remove('ativo'));
            }
        });
    </script>

<script>
    // tags-nav.js
function renderTagsNav() {
    const container = document.getElementById('tagsContainer');
    const tags = searchEngine.getPopularTags(12); // Pega as 12 tags mais populares
    
    container.innerHTML = tags.map(tag => 
        `<li><a href="#" onclick="searchByTag('${tag}'); return false;">${tag}</a></li>`
    ).join('');
}

// Função para buscar por tag (já existe no código anterior)
function searchByTag(tag) {
    document.getElementById('searchInput').value = tag;
    const results = searchEngine.searchByTag(tag);
    renderProducts(results);
    
    // Scroll suave para os resultados
    document.getElementById('productsGrid').scrollIntoView({ 
        behavior: 'smooth' 
    });
}

// Inicializar quando carregar a página
document.addEventListener('DOMContentLoaded', () => {
    renderTagsNav();
});
</script>
